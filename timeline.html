<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS 時間軸來源 - Stream Timeline Overlay</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Extracted Custom Stylesheet -->
  <link rel="stylesheet" href="css/timeline.css">
</head>
<body class="w-full h-full relative">

  <!-- STREAM OVERLAY MAIN CONTAINER -->
  <main id="main-container" class="w-full h-full flex justify-center items-center p-3 relative z-10">
    
    <!-- Timeline Track Wrapper -->
    <div id="track-wrapper" class="w-full max-w-full h-auto track-gradient rounded-full p-2.5 shadow-2xl border-2 border-white/50 backdrop-blur-md transition-all duration-300">
      <div id="timeline-nodes-container" class="flex items-center justify-between gap-3 w-full h-full">
        <!-- Dynamic Pills Rendered by JS -->
      </div>
    </div>

  </main>


  <!-- OBS CONTROL PANEL BUTTON & DRAWER (Press 'H' or Click Gear) -->
  <div id="control-panel" class="fixed top-3 right-3 z-50 transition-all duration-300">
    <!-- Panel Toggle Button -->
    <button id="toggle-panel-btn" onclick="toggleControlPanel()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3 py-2 rounded-full shadow-2xl border border-slate-700 flex items-center justify-center gap-2 text-xs font-semibold transition hover:scale-105">
      <i class="fa-solid fa-sliders text-amber-400"></i>
      <span class="text-[11px]">OBS 控制台 (H)</span>
    </button>

    <!-- Drawer Content -->
    <div id="panel-content" class="hidden absolute right-0 top-11 w-80 glass-panel rounded-2xl p-4 text-white shadow-2xl border border-slate-700 text-xs">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <div class="font-bold flex items-center gap-2 text-amber-400">
          <i class="fa-solid fa-sliders"></i> 時間軸控制台
        </div>
        <span class="text-[10px] text-slate-400">按鍵: ← / → / H</span>
      </div>

      <!-- Quick Stage Switcher -->
      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1.5">切換時間軸階段</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="prevStage()" class="bg-slate-800 hover:bg-slate-700 text-white py-1.5 px-2 rounded-lg font-bold text-xs border border-slate-600 transition">
              <i class="fa-solid fa-chevron-left"></i> 上一階段
            </button>
            <button id="play-pause-btn" onclick="toggleTimer()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 py-1.5 px-2 rounded-lg font-bold text-xs transition">
              <i class="fa-solid fa-pause"></i> 暫停
            </button>
            <button onclick="nextStage()" class="bg-slate-800 hover:bg-slate-700 text-white py-1.5 px-2 rounded-lg font-bold text-xs border border-slate-600 transition">
              下一階段 <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <!-- Timer Mode -->
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1">倒數模式</label>
          <div class="flex items-center gap-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-800">
            <button id="mode-auto" onclick="setTimerMode('auto')" class="flex-1 py-1 text-[11px] rounded font-semibold bg-indigo-600 text-white">自動進行</button>
            <button id="mode-manual" onclick="setTimerMode('manual')" class="flex-1 py-1 text-[11px] rounded font-semibold text-slate-400 hover:text-white">手動觸發</button>
          </div>
        </div>

        <!-- Edit Events Button -->
        <div class="pt-2 border-t border-slate-700">
          <button onclick="openEditModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 py-2 rounded-lg font-semibold text-xs border border-indigo-500/30 flex items-center justify-center gap-2">
            <i class="fa-solid fa-pen-to-square"></i> 編輯階段項目與時間
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Event Editor Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl p-5 text-white border border-slate-700 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> 編輯直播時間軸階段
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div id="modal-events-list" class="space-y-2 overflow-y-auto flex-1 pr-1 mb-3 text-xs">
        <!-- Rendered by JS -->
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700">
        <button onclick="addNewEventRow()" class="bg-slate-800 hover:bg-slate-700 text-xs text-indigo-300 px-3 py-1.5 rounded-lg font-semibold border border-indigo-500/30">
          <i class="fa-solid fa-plus mr-1"></i> 新增階段
        </button>
        <div class="flex gap-2">
          <button onclick="resetDefaultEvents()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg">重設</button>
          <button onclick="saveEditedEvents()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Extracted JavaScript Logic -->
  <script src="js/timeline.js"></script>
</body>
</html>
