<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS 時間軸來源 - Stream Timeline Overlay</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* OBS Browser Source Transparency Fix */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      user-select: none;
    }

    /* Top Subtle Gradient Bar */
    .top-gradient-bar {
      background: linear-gradient(90deg, #4c1d95 0%, #7c3aed 25%, #2563eb 50%, #06b6d4 100%);
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.6);
    }

    /* Bottom / Side Track Gradient (Matches Reference Image) */
    .track-gradient {
      background: linear-gradient(90deg, #a7f3d0 0%, #99f6e4 30%, #a5f3fc 65%, #93c5fd 100%);
    }

    /* Vertical Mode Track Gradient */
    .vertical-track-gradient {
      background: linear-gradient(180deg, #a7f3d0 0%, #99f6e4 30%, #a5f3fc 65%, #93c5fd 100%);
    }

    /* Capsule Pill Node Default */
    .pill-node {
      background: linear-gradient(180deg, #e5e7eb 0%, #cbd5e1 100%);
      border: 2px solid #1e293b;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 4px 6px -1px rgba(0, 0, 0, 0.15);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Active Highlighted Capsule Pill */
    .pill-node.active {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      border-color: #fbbf24;
      color: #ffffff !important;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.7), 0 0 10px rgba(251, 191, 36, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transform: scale(1.04);
    }

    /* Completed Capsule Pill */
    .pill-node.completed {
      background: linear-gradient(180deg, #94a3b8 0%, #64748b 100%);
      border-color: #334155;
      color: #cbd5e1;
      opacity: 0.85;
    }

    /* Control Panel Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="w-full h-full relative">

  <!-- Top Gradient Bar -->
  <div class="top-gradient-bar h-1.5 w-full fixed top-0 left-0 z-40"></div>

  <!-- STREAM OVERLAY MAIN CONTAINER -->
  <main id="main-container" class="w-full h-full flex justify-center items-center p-3 relative z-10">
    
    <!-- Timeline Track Wrapper -->
    <div id="track-wrapper" class="w-full max-w-full h-auto track-gradient rounded-full p-2.5 shadow-2xl border-2 border-white/50 backdrop-blur-md transition-all duration-300">
      <div id="timeline-nodes-container" class="flex items-center justify-between gap-3 w-full h-full">
        <!-- Dynamic Pills Rendered by JS -->
      </div>
    </div>

  </main>


  <!-- OBS CONTROL PANEL BUTTON & DRAWER (Press 'H' or Click Gear) -->
  <div id="control-panel" class="fixed top-3 right-3 z-50 transition-all duration-300">
    <!-- Panel Toggle Button -->
    <button id="toggle-panel-btn" onclick="toggleControlPanel()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3 py-2 rounded-full shadow-2xl border border-slate-700 flex items-center justify-center gap-2 text-xs font-semibold transition hover:scale-105">
      <i class="fa-solid fa-sliders text-amber-400"></i>
      <span class="text-[11px]">OBS 控制台 (H)</span>
    </button>

    <!-- Drawer Content -->
    <div id="panel-content" class="hidden absolute right-0 top-11 w-80 glass-panel rounded-2xl p-4 text-white shadow-2xl border border-slate-700 text-xs">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <div class="font-bold flex items-center gap-2 text-amber-400">
          <i class="fa-solid fa-sliders"></i> 時間軸控制台
        </div>
        <span class="text-[10px] text-slate-400">按鍵: ← / → / H</span>
      </div>

      <!-- Quick Stage Switcher -->
      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1.5">切換時間軸階段</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="prevStage()" class="bg-slate-800 hover:bg-slate-700 text-white py-1.5 px-2 rounded-lg font-bold text-xs border border-slate-600 transition">
              <i class="fa-solid fa-chevron-left"></i> 上一階段
            </button>
            <button id="play-pause-btn" onclick="toggleTimer()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 py-1.5 px-2 rounded-lg font-bold text-xs transition">
              <i class="fa-solid fa-pause"></i> 暫停
            </button>
            <button onclick="nextStage()" class="bg-slate-800 hover:bg-slate-700 text-white py-1.5 px-2 rounded-lg font-bold text-xs border border-slate-600 transition">
              下一階段 <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <!-- Timer Mode -->
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1">倒數模式</label>
          <div class="flex items-center gap-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-800">
            <button id="mode-auto" onclick="setTimerMode('auto')" class="flex-1 py-1 text-[11px] rounded font-semibold bg-indigo-600 text-white">自動進行</button>
            <button id="mode-manual" onclick="setTimerMode('manual')" class="flex-1 py-1 text-[11px] rounded font-semibold text-slate-400 hover:text-white">手動觸發</button>
          </div>
        </div>

        <!-- Edit Events Button -->
        <div class="pt-2 border-t border-slate-700">
          <button onclick="openEditModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 py-2 rounded-lg font-semibold text-xs border border-indigo-500/30 flex items-center justify-center gap-2">
            <i class="fa-solid fa-pen-to-square"></i> 編輯階段項目與時間
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Event Editor Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl p-5 text-white border border-slate-700 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> 編輯直播時間軸階段
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div id="modal-events-list" class="space-y-2 overflow-y-auto flex-1 pr-1 mb-3 text-xs">
        <!-- Rendered by JS -->
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700">
        <button onclick="addNewEventRow()" class="bg-slate-800 hover:bg-slate-700 text-xs text-indigo-300 px-3 py-1.5 rounded-lg font-semibold border border-indigo-500/30">
          <i class="fa-solid fa-plus mr-1"></i> 新增階段
        </button>
        <div class="flex gap-2">
          <button onclick="resetDefaultEvents()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg">重設</button>
          <button onclick="saveEditedEvents()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg">儲存</button>
        </div>
      </div>
    </div>
  </div>


  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initial Timeline Events
    const DEFAULT_EVENTS = [
      { id: 1, title: '開播準備與雜談', time: '19:00', durationMinutes: 15, icon: 'fa-comments' },
      { id: 2, title: '主要遊戲實況', time: '19:15', durationMinutes: 45, icon: 'fa-gamepad' },
      { id: 3, title: '觀眾互動 QA', time: '20:00', durationMinutes: 20, icon: 'fa-users' },
      { id: 4, title: '抽獎與特別活動', time: '20:20', durationMinutes: 15, icon: 'fa-gift' },
      { id: 5, title: '晚安下播晚安', time: '20:35', durationMinutes: 10, icon: 'fa-moon' }
    ];

    // State Variables
    let events = JSON.parse(localStorage.getItem('obs_timeline_events')) || DEFAULT_EVENTS;
    let activeIndex = 0;
    let isTimerRunning = true;
    let timerMode = 'auto'; // 'auto' or 'manual'
    let secondsLeftInStage = events[0] ? events[0].durationMinutes * 60 : 900;
    let timerInterval = null;

    // DOM Elements
    const mainContainer = document.getElementById('main-container');
    const trackWrapper = document.getElementById('track-wrapper');
    const timelineContainer = document.getElementById('timeline-nodes-container');
    const playPauseBtn = document.getElementById('play-pause-btn');

    // Auto Adapt Layout for Vertical (200x2000) or Horizontal (2000x200)
    function updateLayoutOrientation() {
      const isVertical = window.innerHeight > window.innerWidth;

      if (isVertical) {
        // Vertical side bar orientation (e.g. 200 width x 2000 height)
        mainContainer.className = "w-full h-full flex flex-col justify-center items-center p-3 relative z-10";
        trackWrapper.className = "w-full h-full vertical-track-gradient rounded-3xl p-3 shadow-2xl border-2 border-white/50 backdrop-blur-md flex flex-col justify-center";
        timelineContainer.className = "flex flex-col items-center justify-between gap-3 w-full h-full";
      } else {
        // Horizontal bottom bar orientation (e.g. 2000 width x 200 height)
        mainContainer.className = "w-full h-full flex justify-center items-center p-3 relative z-10";
        trackWrapper.className = "w-full max-w-full h-auto track-gradient rounded-full p-2.5 shadow-2xl border-2 border-white/50 backdrop-blur-md";
        timelineContainer.className = "flex items-center justify-between gap-3 w-full h-full";
      }

      renderTimelineNodes();
    }

    // Render Pill Nodes
    function renderTimelineNodes() {
      timelineContainer.innerHTML = '';
      const isVertical = window.innerHeight > window.innerWidth;

      events.forEach((item, index) => {
        const isCurrent = index === activeIndex;
        const isDone = index < activeIndex;

        const pill = document.createElement('div');
        pill.className = `pill-node relative flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-full font-extrabold cursor-pointer transition-all duration-300 min-w-0 ${
          isCurrent ? 'active' : isDone ? 'completed' : ''
        } ${isVertical ? 'w-full my-1' : 'h-full'}`;
        
        pill.onclick = () => jumpToStage(index);

        const iconClass = item.icon || 'fa-star';

        pill.innerHTML = `
          <div class="flex items-center justify-center gap-2 truncate text-center w-full">
            ${isCurrent ? '<span class="w-2 h-2 bg-red-500 rounded-full animate-ping shrink-0"></span>' : ''}
            <i class="fa-solid ${iconClass} text-xs ${isCurrent ? 'text-amber-300' : 'text-slate-700'}"></i>
            <span class="text-xs font-black truncate ${isCurrent ? 'text-white' : 'text-slate-800'}">${escapeHtml(item.title)}</span>
          </div>
        `;

        timelineContainer.appendChild(pill);
      });
    }

    // Main Timer Loop
    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!isTimerRunning) return;

        if (secondsLeftInStage > 0) {
          secondsLeftInStage--;
        } else {
          if (timerMode === 'auto' && activeIndex < events.length - 1) {
            nextStage();
          }
        }
      }, 1000);
    }

    // Navigation Controls
    function nextStage() {
      if (activeIndex < events.length - 1) {
        jumpToStage(activeIndex + 1);
      }
    }

    function prevStage() {
      if (activeIndex > 0) {
        jumpToStage(activeIndex - 1);
      }
    }

    function jumpToStage(index) {
      if (index < 0 || index >= events.length) return;
      activeIndex = index;
      const current = events[activeIndex];
      secondsLeftInStage = current ? current.durationMinutes * 60 : 300;
      renderTimelineNodes();
    }

    function toggleTimer() {
      isTimerRunning = !isTimerRunning;
      playPauseBtn.innerHTML = isTimerRunning 
        ? '<i class="fa-solid fa-pause"></i> 暫停' 
        : '<i class="fa-solid fa-play"></i> 繼續';
      playPauseBtn.classList.toggle('bg-amber-500', isTimerRunning);
      playPauseBtn.classList.toggle('bg-emerald-500', !isTimerRunning);
    }

    function setTimerMode(mode) {
      timerMode = mode;
      document.getElementById('mode-auto').className = mode === 'auto' 
        ? 'flex-1 py-1 text-[11px] rounded font-semibold bg-indigo-600 text-white' 
        : 'flex-1 py-1 text-[11px] rounded font-semibold text-slate-400 hover:text-white';
      
      document.getElementById('mode-manual').className = mode === 'manual' 
        ? 'flex-1 py-1 text-[11px] rounded font-semibold bg-indigo-600 text-white' 
        : 'flex-1 py-1 text-[11px] rounded font-semibold text-slate-400 hover:text-white';
    }

    function toggleControlPanel() {
      const content = document.getElementById('panel-content');
      content.classList.toggle('hidden');
    }

    // Modal Events Editor
    function openEditModal() {
      const container = document.getElementById('modal-events-list');
      container.innerHTML = '';

      events.forEach((evt) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700';
        row.innerHTML = `
          <input type="text" value="${escapeHtml(evt.title)}" placeholder="階段名稱" class="evt-title flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
          <input type="text" value="${escapeHtml(evt.time)}" placeholder="19:00" class="evt-time w-16 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
          <input type="number" value="${evt.durationMinutes}" placeholder="分鐘" class="evt-dur w-14 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
          <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 px-1 text-xs"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(row);
      });

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function addNewEventRow() {
      const container = document.getElementById('modal-events-list');
      const row = document.createElement('div');
      row.className = 'flex items-center gap-1.5 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700';
      row.innerHTML = `
        <input type="text" value="新階段內容" class="evt-title flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
        <input type="text" value="20:00" class="evt-time w-16 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
        <input type="number" value="15" class="evt-dur w-14 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white">
        <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 px-1 text-xs"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(row);
    }

    function saveEditedEvents() {
      const rows = document.querySelectorAll('#modal-events-list > div');
      const newEvents = [];
      const defaultIcons = ['fa-comments', 'fa-gamepad', 'fa-users', 'fa-gift', 'fa-coffee', 'fa-trophy', 'fa-star'];

      rows.forEach((row, i) => {
        const title = row.querySelector('.evt-title').value.trim() || '未命名階段';
        const time = row.querySelector('.evt-time').value.trim() || '00:00';
        const durationMinutes = parseInt(row.querySelector('.evt-dur').value, 10) || 15;
        const icon = defaultIcons[i % defaultIcons.length];

        newEvents.push({ id: i + 1, title, time, durationMinutes, icon });
      });

      if (newEvents.length > 0) {
        events = newEvents;
        localStorage.setItem('obs_timeline_events', JSON.stringify(events));
        activeIndex = 0;
        const first = events[0];
        secondsLeftInStage = first ? first.durationMinutes * 60 : 300;
        renderTimelineNodes();
      }

      closeEditModal();
    }

    function resetDefaultEvents() {
      events = [...DEFAULT_EVENTS];
      localStorage.removeItem('obs_timeline_events');
      openEditModal();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Keyboard Hotkeys Support
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key === 'h' || e.key === 'H') {
        toggleControlPanel();
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        nextStage();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        prevStage();
      } else if (e.key === ' ') {
        e.preventDefault();
        toggleTimer();
      }
    });

    window.addEventListener('resize', updateLayoutOrientation);

    window.onload = function() {
      updateLayoutOrientation();
      startTimerLoop();
    };
  </script>
</body>
</html>
