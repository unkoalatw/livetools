<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS 視訊鏡頭霓虹相框 - Webcam Frame Overlay</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter, Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/webcam.css">
</head>
<body class="w-full h-full relative">

  <!-- STREAM OVERLAY MAIN CONTAINER -->
  <main id="main-container" class="w-full h-full flex justify-center items-center p-3 relative z-10">
    
    <!-- Webcam Frame Overlay -->
    <div id="webcam-frame-el" class="webcam-frame aspect-16-9">
      <div class="webcam-tag">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
        <span id="webcam-tag-el">🔴 LIVE</span>
      </div>
    </div>

  </main>

  <!-- OBS CONTROL PANEL BUTTON & DRAWER -->
  <div id="control-panel" class="fixed top-3 right-3 z-50 transition-all duration-300">
    <button id="toggle-panel-btn" onclick="toggleControlPanel()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3 py-2 rounded-full shadow-2xl border border-slate-700 flex items-center justify-center gap-2 text-xs font-semibold transition hover:scale-105">
      <i class="fa-solid fa-sliders text-amber-400"></i>
      <span class="text-[11px]">OBS 控制台 (H)</span>
    </button>

    <div id="panel-content" class="hidden absolute right-0 top-11 w-80 glass-panel rounded-2xl p-4 text-white shadow-2xl border border-slate-700 text-xs">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <div class="font-bold flex items-center gap-2 text-amber-400">
          <i class="fa-solid fa-camera"></i> 鏡頭相框控制台
        </div>
        <button onclick="hideWholeControlPanel()" class="text-slate-400 hover:text-red-400 text-xs px-2 py-0.5 rounded bg-slate-800 border border-slate-700 transition">
          <i class="fa-solid fa-eye-slash"></i> 隱藏 (H)
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1">切換比例與型態</label>
          <div class="grid grid-cols-3 gap-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-800 text-center">
            <button onclick="setAspect('16-9')" class="py-1 text-[11px] rounded font-semibold bg-indigo-600 text-white">16 : 9</button>
            <button onclick="setAspect('4-3')" class="py-1 text-[11px] rounded font-semibold bg-slate-800 text-slate-300 hover:text-white">4 : 3</button>
            <button onclick="setAspect('circle')" class="py-1 text-[11px] rounded font-semibold bg-slate-800 text-slate-300 hover:text-white">圓形</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/webcam.js"></script>
</body>
</html>
