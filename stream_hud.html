<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS 直播頂底全螢幕邊框看板 - Stream HUD Border Overlay (1920x1080 Responsive)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Teko:wght@500;600;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes om-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes om-pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
    @keyframes om-shimmer { from { transform: translateX(-120%); } to { transform: translateX(320%); } }

    /* Scaling Viewport Container to fit 1920x1080 in any screen without cropping or scrolling */
    #viewport-scaler {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: transparent;
      color: #f5efe4;
      overflow: hidden;
      transform-origin: center center;
      flex-shrink: 0;
    }

    .editable-text {
      outline: none;
      border: 1px dashed transparent;
      transition: border-color 0.2s, background-color 0.2s;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .editable-text:hover {
      border-color: rgba(255, 176, 32, 0.5);
      background: rgba(255, 176, 32, 0.12);
      cursor: text;
    }
    .editable-text:focus {
      border-color: #ffb020;
      background: rgba(255, 176, 32, 0.2);
    }
  </style>
</head>
<body>

<div id="viewport-scaler">

  <!-- TOP HEADER BAR -->
  <div style="position:absolute;top:0;left:0;right:0;height:104px;display:flex;align-items:stretch;background:#12100e;border-bottom:3px solid #ffb020;z-index:10">
    <div style="flex:none;display:flex;align-items:center;gap:22px;padding:0 34px;background:#ffb020;color:#12100e;clip-path:polygon(0 0,100% 0,calc(100% - 30px) 100%,0 100%);padding-right:56px">
      <div style="flex:none;width:56px;height:56px;border:2px solid rgba(18,16,14,.5);display:flex;align-items:center;justify-content:center;color:#12100e;font-size:24px"><i class="fa-solid fa-gamepad"></i></div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div class="editable-text" contenteditable="true" spellcheck="false" style="font:900 36px/1.15 'Noto Sans TC',sans-serif;letter-spacing:.04em">尾熊</div>
        <div class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1.2 'Archivo',sans-serif;letter-spacing:.22em;opacity:.72">KOALA / GAMING</div>
      </div>
    </div>

    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:22px;padding:0 30px;overflow:hidden">
      <div class="editable-text" contenteditable="true" spellcheck="false" style="flex:none;font:800 15px/1 'Archivo',sans-serif;letter-spacing:.26em;color:#ffb020;border-left:3px solid #ffb020;padding-left:14px">NOTICE</div>
      <div style="flex:1;min-width:0;overflow:hidden;position:relative;height:36px">
        <div style="position:absolute;top:0;left:0;display:flex;white-space:nowrap;animation:om-marquee 34s linear infinite">
          <span class="editable-text" contenteditable="true" spellcheck="false" style="font:500 27px/36px 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.88);padding-right:80px">今天挑戰無傷通關第三章，達成就抽遊戲序號　　本週六晚間八點有觀眾同樂場，記得追蹤開啟通知　　抖內目標達成會加碼直播一小時</span>
          <span class="editable-text" contenteditable="true" spellcheck="false" style="font:500 27px/36px 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.88);padding-right:80px">今天挑戰無傷通關第三章，達成就抽遊戲序號　　本週六晚間八點有觀眾同樂場，記得追蹤開啟通知　　抖內目標達成會加碼直播一小時</span>
        </div>
      </div>
    </div>

    <div style="flex:none;display:flex;align-items:center;gap:0;padding-right:0">
      <div style="display:flex;align-items:center;gap:10px;padding:0 22px;height:100%;background:#d93a26">
        <div style="width:9px;height:9px;background:#fff;animation:om-pulse 1.3s ease-in-out infinite"></div>
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:800 17px/1 'Archivo',sans-serif;letter-spacing:.24em;color:#fff">LIVE</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:12px;padding:0 26px;border-left:1px solid rgba(245,239,228,.14)">
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:800 13px/1 'Archivo',sans-serif;letter-spacing:.2em;color:rgba(245,239,228,.42)">UPTIME</span>
        <span id="uptime-display" style="font:600 46px/1 'Teko',sans-serif;letter-spacing:.02em;color:#ffb020;font-variant-numeric:tabular-nums">00:00:00</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:12px;padding:0 30px 0 26px;border-left:1px solid rgba(245,239,228,.14)">
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:800 13px/1 'Archivo',sans-serif;letter-spacing:.2em;color:rgba(245,239,228,.42)">TIME</span>
        <span id="clock-display" style="font:600 46px/1 'Teko',sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums">00:00:00</span>
      </div>
    </div>
  </div>

  <!-- SIDE BORDERS -->
  <div style="position:absolute;top:104px;left:0;width:12px;bottom:118px;background:linear-gradient(180deg,#ffb020,rgba(255,176,32,0));z-index:5"></div>
  <div style="position:absolute;top:104px;right:0;width:12px;bottom:118px;background:linear-gradient(180deg,#ffb020,rgba(255,176,32,0));z-index:5"></div>

  <!-- BOTTOM FOOTER BAR -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:118px;display:flex;align-items:center;gap:0;background:#12100e;border-top:3px solid #ffb020;z-index:10">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:0 34px">
      <div style="display:flex;align-items:baseline;gap:16px">
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1 'Archivo',sans-serif;letter-spacing:.26em;color:#ffb020">DONATION GOAL</span>
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:500 25px/1.2 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.7)">抖內目標・加碼一小時直播</span>
        <span style="margin-left:auto;font:600 44px/1 'Teko',sans-serif;font-variant-numeric:tabular-nums"><span class="editable-text" contenteditable="true" spellcheck="false" style="color:#ffb020">NT$12,480</span><span class="editable-text" contenteditable="true" spellcheck="false" style="color:rgba(245,239,228,.35)"> / 20,000</span></span>
      </div>
      <div style="position:relative;height:18px;background:rgba(245,239,228,.09);overflow:hidden">
        <div style="position:absolute;left:0;top:0;bottom:0;width:62.4%;background:repeating-linear-gradient(115deg,#ffb020 0 14px,#ffc44f 14px 28px);overflow:hidden">
          <div style="position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:om-shimmer 2.8s linear infinite"></div>
        </div>
      </div>
    </div>

    <div style="flex:none;align-self:stretch;display:flex;align-items:center;gap:28px;padding:0 34px 0 40px;background:#ffb020;color:#12100e;clip-path:polygon(30px 0,100% 0,100% 100%,0 100%)">
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:30px;height:30px;border:2px solid rgba(18,16,14,.45);display:flex;align-items:center;justify-content:center;color:#12100e"><i class="fa-brands fa-twitch"></i></div>
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:700 22px/1 'Archivo',sans-serif">@koala_live</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:30px;height:30px;border:2px solid rgba(18,16,14,.45);display:flex;align-items:center;justify-content:center;color:#12100e"><i class="fa-brands fa-discord"></i></div>
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:700 22px/1 'Archivo',sans-serif">discord.gg/koala</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:30px;height:30px;border:2px solid rgba(18,16,14,.45);display:flex;align-items:center;justify-content:center;color:#12100e"><i class="fa-brands fa-instagram"></i></div>
        <span class="editable-text" contenteditable="true" spellcheck="false" style="font:700 22px/1 'Archivo',sans-serif">@koala.ig</span>
      </div>
    </div>
  </div>

</div>

<script>
  // Auto Rescale Function to perfectly scale 1920x1080 stage inside any window without crop
  function autoScaleViewport() {
    const scaler = document.getElementById('viewport-scaler');
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Scale factor based on aspect ratio
    const scaleX = windowWidth / 1920;
    const scaleY = windowHeight / 1080;
    const scale = Math.min(scaleX, scaleY);
    
    scaler.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', autoScaleViewport);
  window.addEventListener('DOMContentLoaded', autoScaleViewport);

  // Uptime & Real Time Clock Logic
  const startTime = Date.now();

  function updateClocks() {
    // 1. Real System Local Time (HH:MM:SS)
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const clockEl = document.getElementById('clock-display');
    if (clockEl) clockEl.textContent = `${h}:${m}:${s}`;

    // 2. Stream Uptime Timer (HH:MM:SS)
    const elapsed = Math.max(0, Math.floor((Date.now() - startTime) / 1000));
    const upH = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const upM = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const upS = String(elapsed % 60).padStart(2, '0');
    const uptimeEl = document.getElementById('uptime-display');
    if (uptimeEl) uptimeEl.textContent = `${upH}:${upM}:${upS}`;
  }

  setInterval(updateClocks, 1000);
  updateClocks();
</script>
</body>
</html>
