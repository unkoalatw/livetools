<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS 主播備忘錄 - Streamer Checklist Overlay</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Extracted Custom Stylesheet -->
  <link rel="stylesheet" href="css/checklist.css">
</head>
<body class="w-full h-full relative">

  <!-- STREAM OVERLAY MAIN CONTAINER -->
  <main id="main-container" class="w-full h-full flex justify-center items-center p-3 relative z-10">
    
    <!-- Checklist Glass Card -->
    <div class="checklist-card w-full max-w-sm p-4 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-white/10 pb-2.5 mb-3">
        <h2 id="card-title" class="text-sm font-black flex items-center gap-2 text-amber-300">
          <i class="fa-solid fa-clipboard-check text-purple-400"></i> 主播備忘錄 & 待辦事項
        </h2>
        <span class="text-[10px] text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700">OBS Overlay</span>
      </div>

      <!-- Tasks List -->
      <div id="tasks-list-container" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
        <!-- Rendered by JS -->
      </div>
    </div>

  </main>


  <!-- OBS CONTROL PANEL BUTTON & DRAWER (Press 'H' or Click Gear) -->
  <div id="control-panel" class="fixed top-3 right-3 z-50 transition-all duration-300">
    <!-- Panel Toggle Button -->
    <button id="toggle-panel-btn" onclick="toggleControlPanel()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3 py-2 rounded-full shadow-2xl border border-slate-700 flex items-center justify-center gap-2 text-xs font-semibold transition hover:scale-105">
      <i class="fa-solid fa-sliders text-amber-400"></i>
      <span class="text-[11px]">OBS 控制台 (H)</span>
    </button>

    <!-- Drawer Content -->
    <div id="panel-content" class="hidden absolute right-0 top-11 w-80 glass-panel rounded-2xl p-4 text-white shadow-2xl border border-slate-700 text-xs">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <div class="font-bold flex items-center gap-2 text-amber-400">
          <i class="fa-solid fa-sliders"></i> 備忘錄控制台
        </div>
        <button onclick="hideWholeControlPanel()" title="隱藏整個控制台 (按 H 可再次呼出)" class="text-slate-400 hover:text-red-400 text-xs px-2 py-0.5 rounded bg-slate-800 border border-slate-700 transition">
          <i class="fa-solid fa-eye-slash"></i> 隱藏 (H)
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold text-slate-300 block mb-1">快捷切換勾選</label>
          <p class="text-[10px] text-slate-400 mb-2">按 ↑ / ↓ 選擇項目，按空白鍵 (Space) 勾選</p>
          <button id="btn-toggle-completed" onclick="toggleHideCompleted()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-2 rounded-lg font-semibold text-xs border border-slate-600 transition">
            <i class="fa-solid fa-eye-slash mr-1"></i> 隱藏已完成
          </button>
        </div>

        <div class="pt-2 border-t border-slate-700">
          <button onclick="openEditModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-purple-300 py-2 rounded-lg font-semibold text-xs border border-purple-500/30 flex items-center justify-center gap-2">
            <i class="fa-solid fa-pen-to-square"></i> 編輯備忘錄項目與標題
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Event Editor Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl p-5 text-white border border-slate-700 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> 編輯主播備忘錄與待辦事項
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <div class="mb-3 p-2.5 bg-slate-900/90 rounded-lg border border-slate-700">
        <label class="text-[11px] font-semibold text-purple-300 flex items-center gap-1.5 mb-1">
          <i class="fa-solid fa-clipboard text-purple-400"></i> 備忘錄標題
        </label>
        <input type="text" id="checklist-title-input" class="w-full bg-slate-800 border border-slate-600 rounded px-2.5 py-1.5 text-xs text-white" value="主播備忘錄 & 待辦事項">
      </div>

      <label class="text-[11px] font-semibold text-slate-300 flex items-center gap-1.5 mb-1">
        <i class="fa-solid fa-list-check text-indigo-400"></i> 事項列表
      </label>
      <div id="modal-tasks-list" class="space-y-2 overflow-y-auto flex-1 pr-1 mb-3 text-xs">
        <!-- Rendered by JS -->
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700">
        <button onclick="addNewTaskRow()" class="bg-slate-800 hover:bg-slate-700 text-xs text-purple-300 px-3 py-1.5 rounded-lg font-semibold border border-purple-500/30">
          <i class="fa-solid fa-plus mr-1"></i> 新增備忘事項
        </button>
        <div class="flex gap-2">
          <button onclick="resetDefaultTasks()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg">重設</button>
          <button onclick="saveEditedTasks()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/checklist.js"></script>
</body>
</html>
