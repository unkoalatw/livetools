<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS 關播下播畫面 - Stream Ended Screen (1920x1080 Responsive)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Teko:wght@600&family=Archivo:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
    }

    @keyframes om-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Fixed 1920x1080 Stage */
    #viewport-scaler {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent;
      color: #f5efe4;
      overflow: hidden;
      transform-origin: top left;
    }

    .editable-text {
      outline: none;
      border: 1px dashed transparent;
      transition: border-color 0.2s, background-color 0.2s;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .editable-text:hover {
      border-color: rgba(255, 176, 32, 0.5);
      background: rgba(255, 176, 32, 0.08);
      cursor: text;
    }
    .editable-text:focus {
      border-color: #ffb020;
      background: rgba(255, 176, 32, 0.15);
    }
  </style>
</head>
<body>

<div id="viewport-scaler">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,176,32,.05) 0 60px,transparent 60px 120px)"></div>
  <div style="position:absolute;right:0;top:0;bottom:0;width:26px;background:#ffb020"></div>

  <!-- Left Content Block -->
  <div style="position:absolute;left:130px;top:200px;display:flex;flex-direction:column;gap:34px;max-width:1020px;z-index:10">
    <div style="display:flex;align-items:center;gap:14px;padding:12px 22px;background:#ffb020;color:#12100e;align-self:flex-start">
      <span data-key="tag" class="editable-text" contenteditable="true" spellcheck="false" style="font:800 18px/1 'Archivo',sans-serif;letter-spacing:.32em">STREAM ENDED</span>
    </div>
    
    <div data-key="title" class="editable-text" contenteditable="true" spellcheck="false" style="font:900 176px/1 'Noto Sans TC',sans-serif;letter-spacing:.01em">感謝收看</div>
    
    <div data-key="desc" class="editable-text" contenteditable="true" spellcheck="false" style="font:500 36px/1.5 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.62);max-width:820px;text-wrap:pretty">今天陪我打了四個小時，真的很謝謝你們。<br>無傷挑戰下次一定成功（吧）。</div>
    
    <div style="display:flex;gap:44px;margin-top:10px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span data-key="next_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1.2 'Archivo',sans-serif;letter-spacing:.24em;color:rgba(245,239,228,.42)">NEXT STREAM</span>
        <span data-key="next_time" class="editable-text" contenteditable="true" spellcheck="false" style="font:900 42px/1.2 'Noto Sans TC',sans-serif;color:#ffb020">週六 20:00</span>
      </div>
      <div style="width:3px;background:rgba(245,239,228,.14)"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span data-key="content_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1.2 'Archivo',sans-serif;letter-spacing:.24em;color:rgba(245,239,228,.42)">CONTENT</span>
        <span data-key="content_text" class="editable-text" contenteditable="true" spellcheck="false" style="font:900 42px/1.2 'Noto Sans TC',sans-serif">觀眾同樂場</span>
      </div>
    </div>
  </div>

  <!-- Right Stats & Socials Block -->
  <div style="position:absolute;right:120px;top:210px;width:540px;display:flex;flex-direction:column;gap:20px;z-index:10">
    <div style="box-sizing:border-box;background:#1c1915;border-left:8px solid #ffb020">
      <div data-key="stats_title" class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1 'Archivo',sans-serif;letter-spacing:.26em;color:#12100e;background:#ffb020;padding:12px 24px">TODAY / 今日數據</div>
      <div style="display:flex;flex-direction:column;gap:22px;padding:26px 26px 30px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
          <span data-key="stat1_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:500 26px/1.3 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.62)">最高同時觀看</span>
          <span data-key="stat1_val" class="editable-text" contenteditable="true" spellcheck="false" style="font:600 52px/1 'Teko',sans-serif;color:#ffb020;font-variant-numeric:tabular-nums">1,284</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
          <span data-key="stat2_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:500 26px/1.3 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.62)">新增會員</span>
          <span data-key="stat2_val" class="editable-text" contenteditable="true" spellcheck="false" style="font:600 52px/1 'Teko',sans-serif;color:#ffb020;font-variant-numeric:tabular-nums">27</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
          <span data-key="stat3_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:500 26px/1.3 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.62)">抖內目標</span>
          <span data-key="stat3_val" class="editable-text" contenteditable="true" spellcheck="false" style="font:900 34px/1.2 'Noto Sans TC',sans-serif;color:#ffb020">達成</span>
        </div>
      </div>
    </div>
    
    <div style="box-sizing:border-box;background:#1c1915;padding:26px;display:flex;flex-direction:column;gap:18px">
      <div data-key="follow_label" class="editable-text" contenteditable="true" spellcheck="false" style="font:800 14px/1.2 'Archivo',sans-serif;letter-spacing:.26em;color:rgba(245,239,228,.42)">FOLLOW</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:36px;height:36px;border:2px solid #ffb020;display:flex;align-items:center;justify-content:center;color:#ffb020"><i class="fa-brands fa-twitch"></i></div>
        <span data-key="twitch" class="editable-text" contenteditable="true" spellcheck="false" style="font:700 25px/1.2 'Archivo',sans-serif;color:rgba(245,239,228,.85)">@koala_live</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:36px;height:36px;border:2px solid #ffb020;display:flex;align-items:center;justify-content:center;color:#ffb020"><i class="fa-brands fa-discord"></i></div>
        <span data-key="discord" class="editable-text" contenteditable="true" spellcheck="false" style="font:700 25px/1.2 'Archivo',sans-serif;color:rgba(245,239,228,.85)">discord.gg/koala</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:36px;height:36px;border:2px solid #ffb020;display:flex;align-items:center;justify-content:center;color:#ffb020"><i class="fa-brands fa-instagram"></i></div>
        <span data-key="ig" class="editable-text" contenteditable="true" spellcheck="false" style="font:700 25px/1.2 'Archivo',sans-serif;color:rgba(245,239,228,.85)">@koala.ig</span>
      </div>
    </div>
  </div>

  <!-- Bottom Marquee Bar -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:100px;display:flex;align-items:center;gap:22px;padding:0 34px;box-sizing:border-box;background:#0b0a08;border-top:3px solid #ffb020;overflow:hidden;z-index:10">
    <span data-key="thanks_label" class="editable-text" contenteditable="true" spellcheck="false" style="flex:none;font:800 14px/1 'Archivo',sans-serif;letter-spacing:.24em;color:#ffb020">THANKS</span>
    <div style="flex:1;min-width:0;overflow:hidden;position:relative;height:36px">
      <div style="position:absolute;top:0;left:0;display:flex;white-space:nowrap;animation:om-marquee 28s linear infinite">
        <span data-key="thanks_list" class="editable-text" contenteditable="true" spellcheck="false" style="font:500 27px/36px 'Noto Sans TC',sans-serif;color:rgba(245,239,228,.75);padding-right:80px">感謝今天的抖內：阿凱・柚子茶不加糖・熊熊護衛隊長・Ray_0512・小豆花・Meowmeow・peko好可愛・阿澤</span>
      </div>
    </div>
  </div>

  <!-- Share URL Control Panel -->
  <div style="position:fixed;top:16px;right:16px;z-index:999">
    <button onclick="copyShareUrl()" style="background:rgba(28,25,21,0.9);color:#ffb020;border:1px solid rgba(255,176,32,0.5);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.5);display:flex;align-items:center;gap:6px">
      <i class="fa-solid fa-link"></i> 複製包含修改文字的 OBS 網址
    </button>
  </div>
</div>

<script>
  // Save & Load Editable State via URL Query Params & localStorage
  const STORAGE_KEY = 'stream_ended_data';
  const urlParams = new URLSearchParams(window.location.search);

  function loadTextState() {
    document.querySelectorAll('.editable-text[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      const fromUrl = urlParams.get(key);
      const fromStorage = localStorage.getItem(`${STORAGE_KEY}_${key}`);

      if (fromUrl) {
        el.innerHTML = decodeURIComponent(fromUrl);
      } else if (fromStorage) {
        el.innerHTML = fromStorage;
      }

      // Auto update URL and localStorage on user edit
      el.addEventListener('input', () => {
        const val = el.innerHTML.trim();
        localStorage.setItem(`${STORAGE_KEY}_${key}`, val);
        updateUrlQuery();
      });
    });
  }

  function getShareUrl() {
    const params = new URLSearchParams();
    document.querySelectorAll('.editable-text[data-key]').forEach(el => {
      const key = el.getAttribute('data-key');
      params.set(key, encodeURIComponent(el.innerHTML.trim()));
    });
    return `${window.location.origin}${window.location.pathname}?${params.toString()}`;
  }

  function updateUrlQuery() {
    window.history.replaceState({}, '', getShareUrl());
  }

  function copyShareUrl() {
    const shareUrl = getShareUrl();
    navigator.clipboard.writeText(shareUrl).then(() => {
      showToast("已成功複製 OBS 網址 (內含已儲存的文字)！");
    }).catch(() => {
      prompt("請複製以下 OBS 網址：", shareUrl);
    });
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#ffb020;color:#12100e;padding:10px 20px;border-radius:10px;font-weight:bold;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,0.5);';
    toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  window.addEventListener('DOMContentLoaded', loadTextState);

  // Auto Rescale Function to perfectly scale 1920x1080 stage inside any window without crop
  function autoScaleViewport() {
    const scaler = document.getElementById('viewport-scaler');
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Scale factor based on aspect ratio
    const scaleX = windowWidth / 1920;
    const scaleY = windowHeight / 1080;
    const scale = Math.min(scaleX, scaleY);
    
    scaler.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', autoScaleViewport);
</script>
</body>
</html>
